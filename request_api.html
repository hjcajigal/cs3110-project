<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Website API</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="request_api.css">
</head>

<body>
    <header>
        <h1>API Page</h1>
    </header>

    <!-- <section id="user_info">
        <div>Username: <span id="username_info">Not logged in</span></div>
        <div>Type: <span id="user_type">guest</span></div>
    </section> -->

    <section id="login">
        <h2>Login</h2>
        <form action="/api/auth" method="post" id="login_form">
            <div><label for="username">Username</label></div>
            <div><input type="text" name="username" id="password" placeholder="Enter username" required></div>
            <div><label for="password">Password</label></div>
            <div><input type="password" name="password" id="password" placeholder="Enter password" required></div>
            <div><button type="submit" >Log In</button></div>
        </form>
    </section>



    <section id="list_section">
        <form action="/api" method="post" id="post_form">
            <label>Character Name Input</label>
            <div><input type="text" name="name_input" id="name_input" required></div>
            <div><button id="add_char_btn">Add</div>
        </form>

        <ul id="list"></ul>
    </section>

    <section id="admin_panel">
        <form action="/api/admin" method="post" id="admin_form">
            <label>Add New User</label>
            <div><input type="text" name="admin_name" id="admin_name" required></div>
            <div><input type="password" name="admin_pass" id="admin_pass" required></div>
            <div>
                <input type="radio" name="user_type" id="user_type_1" value="author">
                <label for="user_type_1">Author</label>

                <input type="radio" name="user_type" id="user_type_2" value="admin">
                <label for="user_type_2">Admin</label>
            </div>
            <div><button type="submit">Add User</button></div>
        </form>
        <ul id="user_list"></ul>
    </section>

    <script src="request_api.js"></script>
</body>

</html>
